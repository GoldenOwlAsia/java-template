spring:
  application:
    name: spring-boot-template
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5460/app-postgres-db}
    username: ${DATABASE_USERNAME:user}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 3s
      repositories:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "${GOOGLE_CLIENT_ID:client-id}"
            client-secret: "${GOOGLE_CLIENT_SECRET:client-secret}"
            scope:
              - email
              - profile
  mail:
    host: smtp.gmail.com
    port: 587
    default-encoding: UTF-8
    protocol: smtp
    test-connection: false
    username: ${MAIL_USERNAME:mail@example.com}
    password: ${MAIL_PASSWORD:mail-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        debug: false

server:
  port: ${PORT:8160}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    redis:
      enabled: false

goldenowl:
  jwt:
    # Override via JWT_SECRET_KEY. Production profile requires this env var (no default).
    secret-key: ${JWT_SECRET_KEY:change-me-to-a-secure-jwt-secret-key-32b}
    token-exp: PT15M         # 15 minutes
    refresh-token-exp: P7D   # 7 days
